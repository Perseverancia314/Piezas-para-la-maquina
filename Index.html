
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piezas para la Computadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            color: #222;
        }

        header {
            background-color: #102a43;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        nav {
            background-color: #1976d2;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .contenedor {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .buscador {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .filtros {
            margin-bottom: 25px;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 4px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .catalogo {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .producto {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px #00000015;
        }

        .producto img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .producto h3 {
            margin: 15px 0 8px;
        }

        .precio {
            color: #087c49;
            font-size: 21px;
            font-weight: bold;
        }

        .carrito {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }

        .carrito li {
            padding: 6px 0;
        }

        footer {
            background-color: #102a43;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Piezas para la Computadora</h1>
        <p>Catálogo de componentes de computadoras</p>
    </header>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#carrito">Carrito</a>
    </nav>

    <main class="contenedor" id="inicio">

        <h2 id="productos">Catálogo de productos</h2>

        <input
            type="text"
            class="buscador"
            id="buscar"
            placeholder="Buscar piezas de computadora..."
            oninput="mostrarProductos()"
        >

        <div class="filtros">
            <button onclick="filtrar('Todos')">
                Todos
            </button>

            <button onclick="filtrar('Procesadores')">
                Procesadores
            </button>

            <button onclick="filtrar('Tarjetas gráficas')">
                Tarjetas gráficas
            </button>

            <button onclick="filtrar('Memoria RAM')">
                Memoria RAM
            </button>

            <button onclick="filtrar('Almacenamiento')">
                Almacenamiento
            </button>

            <button onclick="filtrar('Otros')">
                Otros
            </button>
        </div>

        <div class="catalogo" id="catalogo"></div>

        <section class="carrito" id="carrito">
            <h2>Carrito de compras</h2>

            <ul id="listaCarrito"></ul>

            <h3>
                Total: $<span id="total">0.00</span>
            </h3>

            <button onclick="vaciarCarrito()">
                Vaciar carrito
            </button>
        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Piezas para la Computadora
        </p>
        <p>Catálogo de demostración</p>
    </footer>

    <script>
        const productos = [
            {
                nombre: "Intel Core i7",
                categoria: "Procesadores",
                precio: 299.99,
                imagen: "https://placehold.co/300x200?text=Intel+Core+i7"
            },
            {
                nombre: "AMD Ryzen 7",
                categoria: "Procesadores",
                precio: 279.99,
                imagen: "https://placehold.co/300x200?text=AMD+Ryzen+7"
            },
            {
                nombre: "NVIDIA RTX 5070",
                categoria: "Tarjetas gráficas",
                precio: 549.99,
                imagen: "https://placehold.co/300x200?text=RTX+5070"
            },
            {
                nombre: "AMD Radeon RX",
                categoria: "Tarjetas gráficas",
                precio: 399.99,
                imagen: "https://placehold.co/300x200?text=AMD+Radeon"
            },
            {
                nombre: "Corsair RAM 32GB",
                categoria: "Memoria RAM",
                precio: 109.99,
                imagen: "https://placehold.co/300x200?text=RAM+32GB"
            },
            {
                nombre: "Kingston RAM 16GB",
                categoria: "Memoria RAM",
                precio: 59.99,
                imagen: "https://placehold.co/300x200?text=RAM+16GB"
            },
            {
                nombre: "Samsung SSD 2TB",
                categoria: "Almacenamiento",
                precio: 149.99,
                imagen: "https://placehold.co/300x200?text=SSD+2TB"
            },
            {
                nombre: "WD SSD 1TB",
                categoria: "Almacenamiento",
                precio: 79.99,
                imagen: "https://placehold.co/300x200?text=SSD+1TB"
            },
            {
                nombre: "MSI Motherboard",
                categoria: "Otros",
                precio: 189.99,
                imagen: "https://placehold.co/300x200?text=Motherboard"
            },
            {
                nombre: "Fuente de poder 750W",
                categoria: "Otros",
                precio: 99.99,
                imagen: "https://placehold.co/300x200?text=PSU+750W"
            },
            {
                nombre: "Disipador CPU",
                categoria: "Otros",
                precio: 69.99,
                imagen: "https://placehold.co/300x200?text=CPU+Cooler"
            },
            {
                nombre: "Gabinete Gaming",
                categoria: "Otros",
                precio: 119.99,
                imagen: "https://placehold.co/300x200?text=PC+Case"
            }
        ];

        let categoriaActual = "Todos";
        let carrito = [];

        function mostrarProductos() {
            const busqueda = document
                .getElementById("buscar")
                .value.toLowerCase();

            const catalogo = document
                .getElementById("catalogo");

            catalogo.innerHTML = "";

            productos.forEach((producto, indice) => {
                const coincideCategoria =
                    categoriaActual === "Todos" ||
                    producto.categoria === categoriaActual;

                const coincideBusqueda =
                    producto.nombre.toLowerCase()
                        .includes(busqueda);

                if (coincideCategoria && coincideBusqueda) {
                    const tarjeta =
                        document.createElement("div");

                    tarjeta.className = "producto";

                    tarjeta.innerHTML = `
                        <img src="${producto.imagen}"
                             alt="${producto.nombre}">

                        <h3>${producto.nombre}</h3>

                        <p>${producto.categoria}</p>

                        <p class="precio">
                            $${producto.precio.toFixed(2)}
                        </p>

                        <button onclick="agregarCarrito(${indice})">
                            Agregar al carrito
                        </button>
                    `;

                    catalogo.appendChild(tarjeta);
                }
            });
        }

        function filtrar(categoria) {
            categoriaActual = categoria;
            mostrarProductos();
        }

        function agregarCarrito(indice) {
            carrito.push(productos[indice]);
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document
                .getElementById("listaCarrito");

            const totalElemento = document
                .getElementById("total");

            lista.innerHTML = "";

            let total = 0;

            carrito.forEach((producto, indice) => {
                total += producto.precio;

                const elemento =
                    document.createElement("li");

                elemento.textContent =
                    producto.nombre +
                    " - $" +
                    producto.precio.toFixed(2) +
                    " ";

                const eliminar =
                    document.createElement("button");

                eliminar.textContent = "Eliminar";
                eliminar.onclick = function() {
                    eliminarProducto(indice);
                };

                elemento.appendChild(eliminar);
                lista.appendChild(elemento);
            });

            totalElemento.textContent = total.toFixed(2);
        }

        function eliminarProducto(indice) {
            carrito.splice(indice, 1);
            actualizarCarrito();
        }

        function vaciarCarrito() {
            carrito = [];
            actualizarCarrito();
        }

        mostrarProductos();
    </script>

</body>
</html>
