
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piezas para la Computadora</title>

    <!-- Conexion con CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Piezas para la Computadora</h1>
        <p>Catálogo de componentes de computadoras</p>
    </header>

    <!-- MENU DE NAVEGACION -->
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#carrito">Carrito</a>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor" id="inicio">

        <section id="productos">

            <h2>Catálogo de productos</h2>

            <!-- BUSCADOR -->
            <input
                type="text"
                class="buscador"
                id="buscar"
                placeholder="Buscar piezas de computadora..."
                oninput="mostrarProductos()"
            >

            <!-- FILTROS -->
            <div class="filtros">

                <button onclick="filtrar('Todos')">
                    Todos
                </button>

                <button onclick="filtrar('Procesadores')">
                    Procesadores
                </button>

                <button onclick="filtrar('Tarjetas gráficas')">
                    Tarjetas gráficas
                </button>

                <button onclick="filtrar('Memoria RAM')">
                    Memoria RAM
                </button>

                <button onclick="filtrar('Almacenamiento')">
                    Almacenamiento
                </button>

                <button onclick="filtrar('Otros')">
                    Otros
                </button>

            </div>

            <!-- CATALOGO -->
            <div class="catalogo" id="catalogo">
                <!-- Los productos aparecen mediante JS -->
            </div>

        </section>

        <!-- CARRITO DE COMPRAS -->
        <section class="carrito" id="carrito">

            <h2>Carrito de compras</h2>

            <ul id="listaCarrito"></ul>

            <h3>
                Total: $<span id="total">0.00</span>
            </h3>

            <button onclick="vaciarCarrito()">
                Vaciar carrito
            </button>

        </section>

    </main>

    <!-- PIE DE PAGINA -->
    <footer>
        <p>
            &copy; 2026 Piezas para la Computadora
        </p>

        <p>Catálogo de demostración</p>
    </footer>

    <!-- Conexion con JavaScript -->
    <script src="script.js"></script>

</body>
</html>
